<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Stretch Breaks">
<meta name="description" content="Six guided desk stretches with a 30-second beep timer, one screen at a time.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stretch Breaks</title>
<style>
:root{--accent:#A3E635;--bg:#0B0E07;--card:#141A0D;--text:#F7FEE7;--dim:#C7D6A6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{width:min(480px,100vw - 24px);height:100dvh;max-height:780px;display:flex;flex-direction:column;padding:16px 14px 12px;gap:12px}
h1{font-size:20px;color:var(--accent);text-align:center;letter-spacing:.5px}
.dots{display:flex;justify-content:center;gap:2px}
.dots button{background:none;border:none;min-width:48px;min-height:48px;font-size:18px;color:#4A5732;border-radius:10px}
.dots button.on{color:var(--accent)}
.card{flex:1;min-height:0;background:var(--card);border:1px solid #2A3519;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}
.card h2{font-size:29px;line-height:1.2}
.card p{font-size:16px;line-height:1.5;color:var(--dim);max-width:38ch}
.timerbtn{font-size:26px;font-weight:800;min-height:64px;min-width:220px;padding:0 24px;border-radius:14px;border:2px solid var(--accent);background:transparent;color:var(--accent)}
.timerbtn.running{background:var(--accent);color:#0B0E07}
.nav{display:flex;gap:10px}
.nav button{flex:1;min-height:56px;font-size:18px;font-weight:700;border-radius:14px;border:1px solid #3A4723;background:#1A2110;color:var(--text)}
.nav button:disabled{opacity:.35}
button[data-focusable]:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <h1>Stretch Breaks</h1>
  <div class="dots" id="dots" aria-label="Stretch selector"></div>
  <div class="card">
    <h2 id="sname"></h2>
    <p id="sinstr"></p>
    <button class="timerbtn" id="timerbtn" data-focusable aria-label="Start or pause the 30 second timer">▶ 0:30</button>
  </div>
  <div class="nav">
    <button id="prev" data-focusable>← Prev</button>
    <button id="next" data-focusable>Next →</button>
  </div>
</div>
<script>
(function(){"use strict";
var stretches=[
  {name:"Neck rolls",instr:"Slowly roll your head in a wide circle — 5× each direction."},
  {name:"Shoulder shrugs",instr:"Lift shoulders to your ears, hold 3 seconds, drop. Repeat 8×."},
  {name:"Chest opener",instr:"Clasp hands behind your back, lift your chest, hold 20 seconds."},
  {name:"Seated spinal twist",instr:"Sit tall, twist right while holding the chair — 20 seconds each side."},
  {name:"Wrist circles",instr:"Extend one arm and circle the wrist slowly — 10× each way."},
  {name:"Ankle rolls",instr:"Lift one foot and draw big circles with your toes — 10× each way."}
];
var DURATION=30;
var idx=0, remaining=DURATION, timerId=null, deadline=0;

var dotsEl=document.getElementById('dots');
var nameEl=document.getElementById('sname');
var instrEl=document.getElementById('sinstr');
var timerBtn=document.getElementById('timerbtn');
var prevBtn=document.getElementById('prev');
var nextBtn=document.getElementById('next');

function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    var ctx=new C();
    var o=ctx.createOscillator();
    var g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;
    g.gain.setValueAtTime(0.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
    o.start();o.stop(ctx.currentTime+0.8);
  }catch(e){}
}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60;}
function stopTick(){if(timerId){clearInterval(timerId);timerId=null;}}
function paintTimer(){
  timerBtn.textContent=(timerId?"⏸ ":"▶ ")+fmt(remaining);
  timerBtn.classList.toggle("running",!!timerId);
  timerBtn.setAttribute("aria-label",(timerId?"Pause":"Start")+" the 30 second timer, "+fmt(remaining)+" remaining");
}
function resetTimer(){stopTick();remaining=DURATION;paintTimer();}
function tick(){
  remaining=Math.max(0,(deadline-Date.now())/1000);
  paintTimer();
  if(remaining<=0){stopTick();remaining=DURATION;paintTimer();beep();}
}
function toggleTimer(){
  if(timerId){stopTick();paintTimer();}
  else{deadline=Date.now()+remaining*1000;timerId=setInterval(tick,200);paintTimer();}
}
function render(){
  nameEl.textContent=stretches[idx].name;
  instrEl.textContent=stretches[idx].instr;
  resetTimer();
  var dots=dotsEl.children;
  for(var k=0;k<dots.length;k++){
    dots[k].textContent=(k===idx?"●":"○");
    dots[k].classList.toggle("on",k===idx);
    dots[k].setAttribute("aria-label","Stretch "+(k+1)+": "+stretches[k].name+(k===idx?", current":""));
  }
  prevBtn.disabled=(idx===0);
  nextBtn.disabled=(idx===stretches.length-1);
}
function go(n){idx=Math.max(0,Math.min(stretches.length-1,n));render();}
stretches.forEach(function(s,k){
  var b=document.createElement("button");
  b.setAttribute("data-focusable","");
  b.type="button";
  b.addEventListener("click",function(){go(k);});
  dotsEl.appendChild(b);
});
timerBtn.addEventListener("click",toggleTimer);
prevBtn.addEventListener("click",function(){go(idx-1);});
nextBtn.addEventListener("click",function(){go(idx+1);});

function focusables(){
  return Array.prototype.slice.call(document.querySelectorAll("[data-focusable]"))
    .filter(function(el){return !el.disabled && el.offsetParent!==null;});
}
document.addEventListener("keydown",function(e){
  var list=focusables();
  if(!list.length)return;
  var i2=list.indexOf(document.activeElement);
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){
    e.preventDefault();
    list[(i2+1+list.length)%list.length].focus();
  }else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){
    e.preventDefault();
    list[(i2-1+list.length)%list.length].focus();
  }
});
render();
})();
</script>
</body>
</html>
